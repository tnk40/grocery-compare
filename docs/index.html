<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Substitutes slide-in panel -->
    <div id="substitutes-overlay" class="substitutes-overlay" onclick="closeSubstitutesPanel()"></div>
    <div id="substitutes-panel" class="substitutes-panel">
        <div class="sub-panel-header">
            <h3>Cheaper Alternatives</h3>
            <button class="close-btn" onclick="closeSubstitutesPanel()">×</button>
        </div>
        <div id="substitutes-content"></div>
    </div>

    <div id="app">

        <!-- Login -->
        <div id="login-section" class="login-page">
            <div class="login-card">
                <div class="login-brand">
                    <span class="brand-icon">🛒</span>
                    <h1>Grocery Compare</h1>
                    <p class="subtitle">Smart price comparison across UK supermarkets</p>
                </div>
                <div class="auth-form">
                    <input type="email" id="email" placeholder="Email address" autocomplete="email" />
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
                    <div class="btn-group">
                        <button onclick="login()" class="btn btn-primary">Sign in</button>
                        <button onclick="register()" class="btn btn-outline">Register</button>
                    </div>
                    <p id="auth-message" class="error-message"></p>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-section" class="app-layout" style="display: none;">

            <header class="app-header">
                <div class="header-brand">
                    <span>🛒</span>
                    <span class="header-title">Grocery Compare</span>
                </div>
                <div class="user-info">
                    <span id="user-email" class="user-email"></span>
                    <button onclick="logout()" class="btn btn-ghost">Sign out</button>
                </div>
            </header>

            <main class="main-content">

                <!-- Left: List Builder -->
                <div class="panel left-panel">
                    <h2>Build Your List</h2>

                    <!-- Store Preferences -->
                    <div class="preferences">
                        <div class="pref-item">
                            <label for="preferred-store">Preferred store</label>
                            <select id="preferred-store" onchange="updatePreferredStore(this.value)">
                                <option value="">No preference</option>
                            </select>
                        </div>
                        <div class="pref-item pref-toggle">
                            <label>&nbsp;</label>
                            <label class="stick-label">
                                <input type="checkbox" id="stick-to-store"
                                    onchange="updateStickToStore(this.checked)" />
                                <span class="stick-switch"></span>
                                Only this store
                            </label>
                        </div>
                        <div class="pref-item pref-slider">
                            <label for="threshold-slider">Switch if saving &gt; <span
                                    id="threshold-label">15%</span></label>
                            <input type="range" id="threshold-slider" min="0" max="50" value="15"
                                oninput="updateSwitchThreshold(this.value)" />
                        </div>
                    </div>

                    <!-- Search -->
                    <div class="search-section">
                        <div class="search-bar">
                            <input type="text" id="search-input" placeholder="e.g. milk, butter, orange juice..." />
                            <input type="number" id="quantity" value="1" min="1" />
                        </div>
                        <div class="search-actions">
                            <button onclick="smartMatch()" class="btn btn-primary btn-match">
                                <span class="btn-icon">✦</span> Match
                            </button>
                            <button onclick="manualSearch()" class="btn btn-outline">Search</button>
                        </div>
                        <div id="search-results" class="search-results" style="display: none;"></div>
                    </div>

                    <!-- Basket -->
                    <div class="basket-section">
                        <h3>Your Basket</h3>
                        <table id="basket-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="basket-body"></tbody>
                            <tfoot id="basket-tfoot" style="display:none">
                                <tr class="basket-total-row">
                                    <td colspan="3"><strong>Basket Total</strong></td>
                                    <td><strong id="basket-total-value"></strong></td>
                                    <td colspan="2"></td>
                                </tr>
                            </tfoot>
                        </table>
                        <div class="sync-store-bar" id="sync-store-bar" style="display:none">
                            <button onclick="syncToOneStore()" class="btn btn-outline">&#x1F504; Shop at one
                                store</button>
                            <select id="sync-store-select">
                                <option value="">Auto-pick</option>
                            </select>
                            <span id="sync-message" class="sync-message"></span>
                        </div>
                        <div class="basket-actions">
                            <input type="text" id="list-name" placeholder="List name..." />
                            <button onclick="saveList()" class="btn btn-secondary">Save</button>
                            <button onclick="clearBasket()" class="btn btn-danger">Clear</button>
                        </div>
                        <p id="save-message" class="save-message"></p>
                    </div>

                    <!-- Saved Lists -->
                    <div class="saved-section">
                        <h3>Saved Lists</h3>
                        <div id="saved-lists"></div>
                    </div>
                </div>

                <!-- Right: Price Comparison -->
                <div class="panel right-panel">
                    <h2>Price Comparison</h2>

                    <div id="recommendations">
                        <h3>Cheapest Options</h3>
                        <table id="recommendations-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Store</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody id="recommendations-body"></tbody>
                        </table>
                    </div>

                    <div id="totals">
                        <h3>Store Totals</h3>
                        <table id="totals-table">
                            <thead>
                                <tr>
                                    <th>Store</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="totals-body"></tbody>
                        </table>
                    </div>

                    <div id="savings">
                        <h3 id="savings-text"></h3>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>

</html>
